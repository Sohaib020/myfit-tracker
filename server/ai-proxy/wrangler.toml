name = "myfit-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

# Per-user limit: 20 AI requests a minute (Workers Rate Limiting binding, available on the free plan).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

[vars]
# Your Firebase project id (Firebase console → Project settings). Set by the deploy workflow.
FIREBASE_PROJECT_ID = ""
