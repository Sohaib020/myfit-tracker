name: Site screenshots
# Real app screens with demo data (debug build on an emulator) for the website. Push to branch siteshots-run.
on:
  push:
    branches: [ siteshots-run ]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Fetch sherpa-onnx AAR
        run: mkdir -p app/libs && curl -fsSL --retry 4 -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar
      - name: Build debug APK (x86_64)
        env: { MYFIT_ABIS: x86_64 }
        run: gradle assembleGithubDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash .github/scripts/siteshots.sh
      - name: Save to branch site-shots
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots && git init -q && git checkout -q -b site-shots && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm "Site shots ${{ github.sha }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site-shots
