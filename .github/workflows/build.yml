name: Build APK

on:
  push:
    branches: [ main, 'agent/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch on-device voice engine (sherpa-onnx AAR)
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 4 -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar
          ls -l app/libs

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "Firebase config added"; else echo "No Firebase config — online features hidden"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests (calculations)
        run: |
          set -o pipefail
          gradle testGithubDebugUnitTest --stacktrace 2>&1 | tee build.log || { grep -E "^e: |What went wrong|error:|Execution failed|Could not resolve|Could not find|Dependency|depends on|requires|compileSdk|AGP|minCompileSdk|> [A-Z]|\.kt:[0-9]+" build.log | grep -v "^w: " | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed 's/^/::error title=Build errors::/'; exit 1; }

      - name: Restore signing key from secrets
        env:
          KS_B64: ${{ secrets.MYFIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/myfit.jks"
            echo "MYFIT_KEYSTORE_FILE=$RUNNER_TEMP/myfit.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No MYFIT_KEYSTORE_B64 secret — APK is debug-signed and future builds may not install over it."
          fi

      - name: Build release APK
        env:
          MYFIT_KEYSTORE_PASSWORD: ${{ secrets.MYFIT_KEYSTORE_PASSWORD }}
          AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          set -o pipefail
          gradle assembleGithubRelease :wear:assembleRelease --stacktrace 2>&1 | tee build.log || { grep -E "^e: |What went wrong|error:|Execution failed|Could not resolve|Could not find|Dependency|depends on|requires|compileSdk|AGP|minCompileSdk|> [A-Z]|\.kt:[0-9]+" build.log | grep -v "^w: " | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed 's/^/::error title=Build errors::/'; exit 1; }

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/github/release/app-github-release.apk "out/MyFitTracker-v0.1.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/github/release/app-github-release.apk out/MyFitTracker.apk   # stable name → releases/latest/download/MyFitTracker.apk
          cp wear/build/outputs/apk/release/wear-release.apk out/MyFitWear.apk || true         # Galaxy Watch tile (install on the watch)
          (cd app && zip -qr ../out/schemas.zip schemas) || true

      - uses: actions/upload-artifact@v4
        with:
          name: MyFitTracker-apk
          path: out/*.apk

      - name: Publish as GitHub Release (direct phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MyFit Tracker build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            out/*.apk
            out/schemas.zip
