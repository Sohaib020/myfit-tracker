name: Deploy AI proxy
# Deploys server/ai-proxy to Cloudflare Workers and copies the AI provider keys in as Worker secrets.
# Needs secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FIREBASE_PROJECT_ID (+ the provider keys you use).
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'server/ai-proxy/**' ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first (see server/ai-proxy/README.md)"; exit 1; fi
      - name: Deploy
        working-directory: server/ai-proxy
        run: npx --yes wrangler@3 deploy --var FIREBASE_PROJECT_ID:${{ secrets.FIREBASE_PROJECT_ID }} | tee deploy.log
      - name: Upload provider keys as Worker secrets
        working-directory: server/ai-proxy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          for k in GEMINI_API_KEY GROQ_API_KEY OPENROUTER_API_KEY MISTRAL_API_KEY ELEVENLABS_API_KEY AZURE_SPEECH_KEY AZURE_SPEECH_REGION; do
            v="${!k}"; if [ -n "$v" ]; then printf '%s' "$v" | npx --yes wrangler@3 secret put "$k" >/dev/null && echo "set $k"; fi
          done
      - name: Worker URL
        working-directory: server/ai-proxy
        run: |
          U=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice::AI proxy is live at $U — add it as the AI_PROXY_URL secret"
