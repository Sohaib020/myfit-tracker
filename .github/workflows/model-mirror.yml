name: Mirror offline AI model
# Copies the on-device model from Hugging Face into the GitHub release "models-v1", split into 1.5 GB parts
# (GitHub release files are capped at 2 GB). The app falls back to these parts if Hugging Face fails.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download + verify
        run: |
          curl -fL --retry 5 -o model.litertlm "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm"
          echo "181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c  model.litertlm" | sha256sum -c -
          split -b 1500000000 -d -a 2 model.litertlm gemma-4-E2B-it.litertlm.part
          rm model.litertlm; ls -l
      - name: Publish release models-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view models-v1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create models-v1 -R "$GITHUB_REPOSITORY" --title "Offline AI model mirror" --notes "Gemma 4 E2B (Apache 2.0) split into parts — used automatically by the app if Hugging Face is unreachable." --latest=false
          gh release upload models-v1 -R "$GITHUB_REPOSITORY" gemma-4-E2B-it.litertlm.part* --clobber
