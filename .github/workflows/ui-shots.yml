name: UI screenshot tests
# Renders key UI (Today's progress …) at several phone widths, fails on clipped/overlapping text,
# and saves the PNGs to the ui-shots branch for review.
on:
  push:
    branches: [ main ]
    paths: [ 'app/src/main/java/**', 'app/src/test/**', '.github/workflows/ui-shots.yml' ]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Fetch sherpa AAR
        run: mkdir -p app/libs && curl -fsSL --retry 4 -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar
      - name: Run screenshot tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --tests '*ShotTest*' -Proborazzi.test.record=true 2>&1 | tee t.log || { grep -E "^e: |AssertionError|spills|overlaps|FAILED|What went wrong" t.log | head -60 | sed 's/^/::error::/'; exit 1; }
      - name: Save shots to ui-shots branch
        if: always()
        run: |
          mkdir -p pub && cp -r app/build/shots/* pub/ 2>/dev/null || true
          cd pub && [ "$(ls | wc -l)" -gt 0 ] || exit 0
          git init -q && git checkout -q -b ui-shots && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm "UI shots ${{ github.sha }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-shots
