name: Calisthenics 3D clips
# R32: the trainer coaches perform every calisthenics step (tools/coach3d/cali_render.py, poses from
# app/src/main/assets/calisthenics.json) -> per-step alpha MP4 loops + stills -> release cali3d-v1 (<who>.zip)
# and a preview sheet on branch cali3d-out. Push to branch cali3d-run (or run manually) to start.
on:
  push:
    branches: [ cali3d-run ]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        who: [trainer_m, trainer_f]
        chain: [push, pull, row, dip, legs, hinge, core, hand]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: coach3d-assets, path: assets }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Render
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libxi6 libxkbcommon0 libsm6 libgl1 libxrender1 libxxf86vm1 libxfixes3 >/dev/null
          pip install -q bpy==4.2.0 pillow numpy
          CALI_RES=560 python tools/coach3d/cali_render.py assets/glb ${{ matrix.who }} ${{ matrix.chain }} out/${{ matrix.who }} 10 > log.txt 2>&1 || true
          grep -E "STEP_DONE|RENDER_DONE|Error|Traceback" log.txt | head -40
          grep -q RENDER_DONE log.txt || { tail -30 log.txt | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: 'cali-${{ matrix.who }}-${{ matrix.chain }}', path: out, retention-days: 3 }
  pack:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Pack
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg >/dev/null
          pip install -q pillow numpy
          mkdir -p merged rel pub && for d in parts/*/; do cp -rn "$d"* merged/; done
          for W in $(ls merged); do
            python tools/coach3d/cali_pack.py merged/$W pub/$W | tail -60
            (cd pub/$W && zip -q -r ../../rel/$W.zip . -i '*.mp4' '*.webp')
            echo "::notice::$W pack $(du -k rel/$W.zip | cut -f1) KB"
          done
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          for w in sorted(os.listdir('pub')):
              ks = sorted(f[:-5] for f in os.listdir(f'pub/{w}') if f.endswith('.webp'))
              C = 8; S = 180; R = (len(ks) + C - 1) // C
              sh = Image.new('RGBA', (C * S, R * (S + 16)), (34, 38, 50, 255)); d = ImageDraw.Draw(sh)
              for i, k in enumerate(ks):
                  im = Image.open(f'pub/{w}/{k}.webp').convert('RGBA').resize((S, S))
                  x, y = (i % C) * S, (i // C) * (S + 16)
                  sh.alpha_composite(im, (x, y + 16)); d.text((x + 3, y + 2), k[:28], fill=(230, 230, 240))
              sh.convert('RGB').save(f'pub/sheet_{w}.jpg', quality=85)
          PY
      - name: Release cali3d-v1
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view cali3d-v1 >/dev/null 2>&1 || gh release create cali3d-v1 --title "Calisthenics 3D clips v1" --notes "R32 coach-performed calisthenics steps (alpha MP4 + stills)" --prerelease
          for z in rel/*.zip; do gh release upload cali3d-v1 "$z" --clobber; done
      - name: Publish preview branch
        run: |
          cd pub && git init -q && git checkout -q -b cali3d-out && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm "cali clips ${{ github.run_number }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" cali3d-out
